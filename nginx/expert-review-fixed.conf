# 专家盲审系统 Nginx 配置（修正版）
# 请将 your-domain.com 替换为您的实际域名

server {
    listen 80;
    server_name your-domain.com;  # 替换为您的域名
    
    # 日志配置
    access_log /var/log/nginx/expert-review-access.log;
    error_log /var/log/nginx/expert-review-error.log;
    
    # 客户端最大请求体大小 (支持大文件上传)
    client_max_body_size 50M;
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # 主要应用代理 - 所有请求都转发到Next.js应用
    location / {
        proxy_pass http://127.0.0.1:3000;  # 使用127.0.0.1而不是localhost
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 支持大文件上传
        proxy_request_buffering off;
        
        # 错误处理
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }
    
    # 静态文件缓存（Next.js的静态资源）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # API接口特殊处理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API不缓存
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }
    
    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }
    
    # 错误页面
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
