version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: expert_review_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: expert_review
      MYSQL_USER: expert_user
      MYSQL_PASSWORD: expert_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  # Next.js应用
  app:
    build: .
    container_name: expert_review_app
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=expert_review
      - DB_USER=expert_user
      - DB_PASSWORD=expert_password
      - JWT_SECRET=your_jwt_secret_key_here_change_in_production
      - AES_SECRET_KEY=your_aes_secret_key_32_chars_long
      - UPLOAD_DIR=/opt/team_data
      - MAX_FILE_SIZE=10485760
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123
    volumes:
      - /opt/team_data:/opt/team_data
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:
